
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            /* เปลี่ยนโทนสีหลักเป็นทองโมเดิร์นและแชมเปญพรีเมียม */
            --main: #b38f4f; /* ทองสุขุม */
            --main-light: #d4af37; /* ทองสว่างพรีเมียม */
            --tech-gold: #f3e5ab; /* ทองแชมเปญนุ่มๆ */
            --bg-gradient: linear-gradient(135deg, #f9f7f2 0%, #f0ebdf 100%); 
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #2c2519; /* น้ำตาลเข้มเกือบดำเพื่อคุมโทนอุ่น */
            --text-muted: #7c7261;
            --input-bg: #ffffff;
            --border-color: rgba(179, 143, 79, 0.15);
            --shadow: 0 10px 30px rgba(179, 143, 79, 0.06);
        }
        
        * { box-sizing: border-box; transition: all 0.25s ease-in-out; }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg-gradient);
            margin: 0; 
            padding: 25px 15px; 
            color: var(--text-dark); 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 430px; margin: 0 auto; }
        
        /* ==========================================================================
           NEW ULTRA PREMIUM GOLD VIP CARD (MODERN GOLD GLASSY)
           ========================================================================== */
        .card-vip { 
            /* พื้นหลังกระจกแก้วใสโทนสว่าง ไล่เฉดสีทองแชมเปญนุ่มนวล */
            background: linear-gradient(135deg, #ffffff 0%, #faf5ea 100%); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            position: relative;
            padding: 32px 24px; 
            border-radius: 24px; 
            
            /* มิติเงาและขอบแบบพรีเมียมซอฟต์สีทอง */
            box-shadow: 0 20px 40px rgba(179, 143, 79, 0.12), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.9);
                        
            margin-bottom: 25px; 
            overflow: hidden; 
            border: 1px solid rgba(179, 143, 79, 0.18); 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ลวดลาย Tech Lines สีทองพรีเมียมแบบกึ่งโปร่งแสง */
        .card-vip::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(115deg, transparent 70%, rgba(212, 175, 55, 0.04) 70%, rgba(212, 175, 55, 0.04) 73%, transparent 73%),
                linear-gradient(115deg, transparent 40%, rgba(179, 143, 79, 0.03) 40%, rgba(179, 143, 79, 0.03) 48%, transparent 48%),
                linear-gradient(115deg, transparent 45%, rgba(243, 229, 171, 0.06) 45%, rgba(243, 229, 171, 0.06) 46%, transparent 46%);
            opacity: 1;
            z-index: 1;
            pointer-events: none;
        }

        /* เอฟเฟกต์สะท้อนแสงออร่าทองสว่างนุ่มๆ มุมการ์ด */
        .card-vip::after {
            content: "";
            position: absolute;
            top: -20%;
            right: -20%;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, transparent 75%);
            z-index: 1;
            pointer-events: none;
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            z-index: 2;
            gap: 15px;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* ป้ายโลโก้ดีไซน์คลีนแมตต์ พื้นสีทองไล่เฉดอักษรขาว */
        .card-label { 
            font-size: 0.7rem; 
            letter-spacing: 1.5px; 
            font-weight: 700; 
            color: #ffffff; 
            display: inline-block; 
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--main) 0%, var(--main-light) 100%);
            padding: 5px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(179, 143, 79, 0.2);
            align-self: flex-start;
        }
        
        /* ชื่อสมาชิกสีทองเข้มหรูหราคมชัด */
        .card-name { 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: uppercase; 
            color: var(--text-dark); 
            text-align: left;
            letter-spacing: 0.5px;
            line-height: 1.2;
            word-break: break-word;
        }
        
        .card-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        
        /* ปรับสไตล์ขอบรูปภาพโปรไฟล์ให้เข้ากับโทนทองพรีเมียม */
        #userImg { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: 4px solid #ffffff;
            object-fit: cover; 
            background: #ffffff;
            box-shadow: 0 10px 20px rgba(179, 143, 79, 0.15);
        }

        /* ส่วนแสดงรายละเอียดข้อมูลในการ์ด */
        .card-detail-group {
            z-index: 2;
            border-top: 1px solid rgba(179, 143, 79, 0.08);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .card-detail { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            font-weight: 400;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        .card-detail span {
            color: var(--text-dark);
            font-weight: 500;
            margin-left: 8px;
        }
        
        /* Interactive Hover */
        .card-vip:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px rgba(179, 143, 79, 0.18);
        }
        .card-vip:hover #userImg {
            transform: scale(1.03);
            box-shadow: 0 12px 25px rgba(179, 143, 79, 0.25);
        }

        /* ==========================================================================
           Modern Clean White Sections & Forms
           ========================================================================== */
        .section { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px; 
            padding: 25px 20px; 
            margin-bottom: 25px; 
            box-shadow: var(--shadow); 
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        
        h3 { 
            margin: 0 0 20px 0; 
            font-size: 1.1rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: var(--text-dark); 
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, var(--main-light), var(--main));
            margin-right: 10px;
            border-radius: 2px;
        }
        
        label { 
            font-size: 0.8rem; 
            font-weight: 500; 
            margin-top: 14px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 0.5px;
        }
        
        input, textarea, select { 
            width: 100%; 
            padding: 12px 16px; 
            margin-top: 6px; 
            border: 1px solid rgba(179, 143, 79, 0.15); 
            border-radius: 12px; 
            font-family: 'Kanit'; 
            font-size: 0.95rem; 
            background-color: var(--input-bg);
            color: var(--text-dark) !important; 
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.01);
        }
        
        input::placeholder, textarea::placeholder { color: #b3ab9d; }

        select { 
            appearance: none; 
            -webkit-appearance: none;
            /* ปรับสีไอคอนลูกศร Dropdown ให้เข้ากับสีน้ำตาล/ทอง */
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237c7261%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; 
            background-position: right 16px top 50%; 
            background-size: 11px auto;
            padding-right: 40px; 
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--main-light); 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            background-color: #ffffff; 
        }
        
        /* ปุ่มส่งข้อมูลสีทองสดหรูหรา */
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(90deg, var(--main) 0%, var(--main-light) 100%); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 500; 
            margin-top: 25px; 
            cursor: pointer; 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(179, 143, 79, 0.25);
        }
        .btn-submit:hover {
            box-shadow: 0 10px 25px rgba(179, 143, 79, 0.4);
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #d0c9bc; box-shadow: none; cursor: not-allowed; }

        /* ส่วนประวัติรายการ */
        .h-item { 
            border-bottom: 1px solid rgba(179, 143, 79, 0.08); 
            padding: 14px 0; 
        }
        .h-item:last-child { border-bottom: none; }
        .h-date { color: var(--text-muted); font-size: 0.75rem; font-weight: 400; }
        .h-topic { font-weight: 500; font-size: 0.95rem; margin: 4px 0; color: var(--text-dark); }
        .h-note { color: var(--text-muted); font-size: 0.85rem; font-weight: 300; background: #fdfcf9; padding: 8px 12px; border-radius: 8px; margin-top: 4px; border-left: 2px solid var(--main-light); }

        /* หน้าจอ Loading โทนสีทองหรูหรา */
        .loading { 
            position: fixed; 
            inset: 0; 
            background: rgba(249, 247, 242, 0.95); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            font-weight: 600; 
            font-size: 1.1rem; 
            color: var(--main); 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="loading" class="loading">SYNCING DATA...</div>

<div class="container">
    <div class="card-vip">
        <div class="card-top-row">
            <div class="card-info">
                <div class="card-label">THAI SINTO SERVICES</div>
                <div id="dispName" class="card-name">GUEST</div>
            </div>
            <div class="card-avatar-wrap">
                <img id="userImg" src="https://via.placeholder.com/120">
            </div>
        </div>
        
        <div class="card-detail-group">
            <div id="dispCompany" class="card-detail">Company: <span>-</span></div>
            <div id="dispEmail" class="card-detail">Email: <span>-</span></div>
        </div>
    </div>

    <div class="section">
        <h3>Request / แจ้งบริการ</h3>
        
        <label>Subject / หัวข้อ</label>
        <select id="subject">
            <option value="" disabled selected>-- เลือกหัวข้อบริการ --</option>
            <option value="Machine Inquiry">Machine Inquiry สนใจสอบถามข้อมูลเครื่องจักร</option>
            <option value="Preventive Maintenance (PM) Check">Preventive Maintenance (PM) Check สอบถามตรวจเช็คสภาพเครื่องจักร</option>
            <option value="Spare Parts Quotation">Spare Parts Quotation สอบถามขอใบเสนอราคา</option>
            <option value="Dry Ice Blasting Service บริการทำความสะอาด">Dry Ice Blasting Service บริการทำความสะอาด</option>
            <option value="Dust Check System บริการตรวจสอบระบบดักฝุ่น">Dust Check System บริการตรวจสอบระบบดักฝุ่น</option>
            <option value="Dust Detection App บริการตรวจจับการสะสมของฝุ่น">Dust Detection App บริการตรวจจับการสะสมของฝุ่น</option>
            <option value="Remote Monitoring System บริการติดตามสถานะเครื่องจักร">Remote Monitoring System บริการติดตามสถานะเครื่องจักร</option>
        </select>
        
        <label>Full Name / ชื่อ-นามสกุล</label>
        <input type="text" id="fullName" placeholder="Your full name">
        
        <label>Company / บริษัท</label>
        <input type="text" id="company" placeholder="Company name">

        <label>Email / อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com">
        
        <label>Phone / เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10">
        
        <label>Details / รายละเอียด</label>
        <textarea id="userNote" rows="3" placeholder="Explain your request..."></textarea>
        
        <button id="btnSave" class="btn-submit" onclick="saveData()">SUBMIT REQUEST</button>
    </div>

    <div class="section">
        <h3>Recent Activity / ประวัติ</h3>
        <div id="historyList">
            <p style="color:var(--text-muted); text-align:center; font-weight: 300; font-size: 0.9rem;">No recent activity</p>
        </div>
    </div>
</div>

<script>
    const LIFF_ID = "2008820291-s6WNZ5xr"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkWegA83btvrRNcR55zFYrIK_ioqhN_zTRwSgwkNpc_WUvEbC5WmIY7Oh_DnqfL9XX/exec"; 

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById("userImg").src = profile.pictureUrl;
                loadData(profile.userId);
            }
        } catch (e) { console.error("LIFF Init Error:", e); }
    }

    async function loadData(userId) {
        try {
            const res = await fetch(`${SCRIPT_URL}?userId=${userId}`);
            const data = await res.json();
            if (data.status === "found") {
                document.getElementById("dispName").innerText = data.user.fullName.toUpperCase();
                document.getElementById("dispCompany").innerHTML = "Company: <span>" + data.user.company + "</span>";
                document.getElementById("dispEmail").innerHTML = "Email: <span>" + data.user.email + "</span>";
                
                document.getElementById("fullName").value = data.user.fullName;
                document.getElementById("company").value = data.user.company;
                document.getElementById("email").value = data.user.email;
                document.getElementById("phone").value = data.user.phone;
                
                if (data.history && data.history.length > 0) {
                    document.getElementById("historyList").innerHTML = data.history.map(h => `
                        <div class="h-item">
                            <div class="h-date">${h.date}</div>
                            <div class="h-topic">${h.subject}</div>
                            <div class="h-note">${h.note || '-'}</div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.log("Data Load Error"); }
    }

    async function saveData() {
        const sub = document.getElementById("subject").value;
        const name = document.getElementById("fullName").value.trim();
        const comp = document.getElementById("company").value.trim();
        const email = document.getElementById("email").value.trim();
        const ph = document.getElementById("phone").value.trim();
        const note = document.getElementById("userNote").value.trim();

        if (!sub) return alert("กรุณาเลือก SUBJECT / หัวข้อ");
        if (!name || !email || !ph) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        if (ph.length < 9) return alert("กรุณาตรวจสอบเบอร์โทรศัพท์");

        document.getElementById("loading").style.display = "flex";
        document.getElementById("btnSave").disabled = true;

        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId, 
                lineName: profile.displayName,
                fullName: name, 
                company: comp || "-", 
                email: email, 
                phone: ph,
                subject: sub, 
                note: note
            };

            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });

            if (liff.isInClient()) {
                const ts = new Date().toLocaleString('th-TH');
                await liff.sendMessages([{
                    "type": "text",
                    "text": `● NEW SERVICE REQUEST\n—\nSubject: ${sub}\nDetails: ${note || '-'}\n\nCustomer: ${name}\nCompany: ${comp || '-'}\nEmail: ${email}\nPhone: ${ph}\n—\n*Recorded at ${ts}*`
                }]);
            }

            alert("SUCCESSFULLY SUBMITTED!");
            location.reload();
        } catch (e) { 
            alert("Error: Connection Failed"); 
        } finally {
            document.getElementById("loading").style.display = "none";
            document.getElementById("btnSave").disabled = false;
        }
    }

    window.onload = function() {
        main();
    };
</script>
</body>
</html>
